name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or candidate label, for example v0.1.0-rc.1
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validation:
    name: Release validation
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    needs: validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          case "$version" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Release version must contain only letters, numbers, dots, underscores or hyphens."
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release source bundle
        run: make release-artifacts RELEASE_VERSION="${{ steps.release.outputs.version }}"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: mcp-secret-manager-release-${{ steps.release.outputs.version }}
          path: dist/release/
          if-no-files-found: error

  draft-github-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: mcp-secret-manager-release-${{ github.ref_name }}
          path: dist/release

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/release/*
          --draft
          --verify-tag
          --title "MCP Secret Manager ${GITHUB_REF_NAME}"
          --notes-file dist/release/RELEASE_NOTES.md
