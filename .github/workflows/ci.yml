name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, security/production-readiness]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --verbose --redact /repo

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"

      - name: Audit backend dependencies
        working-directory: backend
        run: >-
          uv run --extra dev --with pip-audit==2.10.1
          pip-audit --progress-spinner off --skip-editable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcp_secret_manager_test
          POSTGRES_USER: mcp_secret_manager
          POSTGRES_PASSWORD: mcp_secret_manager_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_secret_manager -d mcp_secret_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      MCP_SECRET_MANAGER_ENVIRONMENT: test
      MCP_SECRET_MANAGER_DATABASE_URL: postgresql+asyncpg://mcp_secret_manager:mcp_secret_manager_test_password@127.0.0.1:5432/mcp_secret_manager_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck
        run: python -m mypy src tests

      - name: Test
        run: python -m pytest

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://api.example.test
      NEXT_PUBLIC_APP_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
