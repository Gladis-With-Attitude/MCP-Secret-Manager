services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-secret-manager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_secret_manager}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_secret_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_secret_manager_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp_secret_manager

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: mcp-secret-manager-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    environment:
      MCP_SECRET_MANAGER_ENVIRONMENT: development
      MCP_SECRET_MANAGER_SERVICE_NAME: mcp-secret-manager
      MCP_SECRET_MANAGER_DEBUG: "false"
      MCP_SECRET_MANAGER_LOG_LEVEL: INFO
      MCP_SECRET_MANAGER_LOG_JSON: "false"
      MCP_SECRET_MANAGER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_secret_manager}:${POSTGRES_PASSWORD:-mcp_secret_manager_dev_password}@postgres:5432/${POSTGRES_DB:-mcp_secret_manager}
      MCP_SECRET_MANAGER_REST_HOST: 0.0.0.0
      MCP_SECRET_MANAGER_REST_PORT: 8000
      MCP_SECRET_MANAGER_OPENAPI_ENABLED: "true"
      MCP_SECRET_MANAGER_CORS_ALLOWED_ORIGINS: ${MCP_SECRET_MANAGER_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      MCP_SECRET_MANAGER_CORS_ALLOWED_METHODS: ${MCP_SECRET_MANAGER_CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      MCP_SECRET_MANAGER_CORS_ALLOWED_HEADERS: ${MCP_SECRET_MANAGER_CORS_ALLOWED_HEADERS:-Authorization,Content-Type}
      MCP_SECRET_MANAGER_CORS_ALLOW_CREDENTIALS: ${MCP_SECRET_MANAGER_CORS_ALLOW_CREDENTIALS:-true}
      MCP_SECRET_MANAGER_AUDIT_RETENTION_DAYS: 365
      MCP_SECRET_MANAGER_SECRET_KEY: ${MCP_SECRET_MANAGER_SECRET_KEY:-development-only-secret-key-change-me}
      MCP_SECRET_MANAGER_TLS_REQUIRED: ${MCP_SECRET_MANAGER_TLS_REQUIRED:-false}
      MCP_SECRET_MANAGER_SECURE_COOKIES: ${MCP_SECRET_MANAGER_SECURE_COOKIES:-false}
      MCP_SECRET_MANAGER_ALLOW_INSECURE_DEV_DEFAULTS: ${MCP_SECRET_MANAGER_ALLOW_INSECURE_DEV_DEFAULTS:-true}
      MCP_SECRET_MANAGER_MASTER_KEY_BASE64: ${MCP_SECRET_MANAGER_MASTER_KEY_BASE64:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
      MCP_SECRET_MANAGER_MASTER_KEY_VERSION: 1
      MCP_SECRET_MANAGER_MCP_ENABLED: ${MCP_SECRET_MANAGER_MCP_ENABLED:-true}
      MCP_SECRET_MANAGER_DOCKER_ENABLED: "true"
      MCP_SECRET_MANAGER_BOOTSTRAP_ENABLED: ${MCP_SECRET_MANAGER_BOOTSTRAP_ENABLED:-true}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_EMAIL: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_EMAIL:-admin@example.local}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_NAME: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_NAME:-Administrator}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_PASSWORD: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_PASSWORD:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_API_KEY: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_API_KEY:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_ENABLED: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_ENABLED:-false}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_PROJECT_ID: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_PROJECT_ID:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_NAME: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_NAME:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_API_KEY: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_API_KEY:-}
    ports:
      - "127.0.0.1:${MCP_SECRET_MANAGER_REST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - mcp_secret_manager

  bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      MCP_SECRET_MANAGER_ENVIRONMENT: development
      MCP_SECRET_MANAGER_SERVICE_NAME: mcp-secret-manager
      MCP_SECRET_MANAGER_LOG_LEVEL: INFO
      MCP_SECRET_MANAGER_DOCKER_ENABLED: "true"
      MCP_SECRET_MANAGER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_secret_manager}:${POSTGRES_PASSWORD:-mcp_secret_manager_dev_password}@postgres:5432/${POSTGRES_DB:-mcp_secret_manager}
      MCP_SECRET_MANAGER_BOOTSTRAP_ENABLED: ${MCP_SECRET_MANAGER_BOOTSTRAP_ENABLED:-true}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_EMAIL: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_EMAIL:-admin@example.local}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_NAME: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_NAME:-Administrator}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_PASSWORD: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_PASSWORD:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_API_KEY: ${MCP_SECRET_MANAGER_BOOTSTRAP_ADMIN_API_KEY:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_ENABLED: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_ENABLED:-false}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_PROJECT_ID: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_PROJECT_ID:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_NAME: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_NAME:-}
      MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_API_KEY: ${MCP_SECRET_MANAGER_BOOTSTRAP_SERVICE_ACCOUNT_API_KEY:-}
    command: ["sh", "/app/scripts/bootstrap-system.sh"]
    volumes:
      - ./backend:/app
    networks:
      - mcp_secret_manager

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MCP_SECRET_MANAGER_ENVIRONMENT: development
      MCP_SECRET_MANAGER_SERVICE_NAME: mcp-secret-manager
      MCP_SECRET_MANAGER_LOG_LEVEL: INFO
      MCP_SECRET_MANAGER_DOCKER_ENABLED: "true"
      MCP_SECRET_MANAGER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_secret_manager}:${POSTGRES_PASSWORD:-mcp_secret_manager_dev_password}@postgres:5432/${POSTGRES_DB:-mcp_secret_manager}
      MCP_SECRET_MANAGER_ALEMBIC_CONFIG: /db/alembic.ini
      MCP_SECRET_MANAGER_MIGRATION_WAIT_TIMEOUT_SECONDS: ${MCP_SECRET_MANAGER_MIGRATION_WAIT_TIMEOUT_SECONDS:-60}
      MCP_SECRET_MANAGER_MIGRATION_LOCK_TIMEOUT_SECONDS: ${MCP_SECRET_MANAGER_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
    command: ["sh", "/app/scripts/manage-db.sh", "upgrade"]
    volumes:
      - ./backend:/app
      - ./db:/db
    networks:
      - mcp_secret_manager

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: mcp-secret-manager-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      - mcp_secret_manager

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: mcp-secret-manager-prometheus
    profiles:
      - observability
    depends_on:
      - backend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mcp_secret_manager

networks:
  mcp_secret_manager:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  frontend_node_modules:
  frontend_next:
