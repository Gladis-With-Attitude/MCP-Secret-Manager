services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-secret-manager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_secret_manager}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_secret_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_secret_manager_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp_secret_manager

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: mcp-secret-manager-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MCP_SECRET_MANAGER_ENVIRONMENT: local
      MCP_SECRET_MANAGER_SERVICE_NAME: mcp-secret-manager
      MCP_SECRET_MANAGER_LOG_LEVEL: INFO
      MCP_SECRET_MANAGER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_secret_manager}:${POSTGRES_PASSWORD:-mcp_secret_manager_dev_password}@postgres:5432/${POSTGRES_DB:-mcp_secret_manager}
      MCP_SECRET_MANAGER_REST_HOST: 0.0.0.0
      MCP_SECRET_MANAGER_REST_PORT: 8000
      MCP_SECRET_MANAGER_OPENAPI_ENABLED: "true"
      MCP_SECRET_MANAGER_AUDIT_RETENTION_DAYS: 365
      MCP_SECRET_MANAGER_MASTER_KEY_BASE64: ${MCP_SECRET_MANAGER_MASTER_KEY_BASE64:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
      MCP_SECRET_MANAGER_MASTER_KEY_VERSION: 1
    ports:
      - "127.0.0.1:${MCP_SECRET_MANAGER_REST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - mcp_secret_manager

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: mcp-secret-manager-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      - mcp_secret_manager

networks:
  mcp_secret_manager:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
