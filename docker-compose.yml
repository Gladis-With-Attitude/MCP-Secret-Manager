services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-secret-manager-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_secret_manager}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_secret_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_secret_manager_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp_secret_manager

networks:
  mcp_secret_manager:
    driver: bridge

volumes:
  postgres_data:
